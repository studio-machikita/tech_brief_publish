<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f4">
  <title>Sales Lens — 売上を見る</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Sales Lens ホーム"><span class="brand-icon">SL</span><span>Sales Lens</span></a>
      <span class="local-badge"><i></i> この端末で処理</span>
    </header>
    <section class="intro">
      <div><p class="eyebrow">売上データを、ひと目で。</p><h1>売上ダッシュボード</h1><p class="lede">CSVから売上の傾向を確認できます。</p></div>
      <label class="upload-button" for="csv-file"><span aria-hidden="true">↑</span> CSVを読み込む<input id="csv-file" data-testid="csv-file" type="file" accept=".csv,text/csv"></label>
    </section>
    <div class="source-row"><span id="source-name">サンプルデータ</span><button id="load-sample" data-testid="load-sample" class="text-button" type="button">サンプルに戻す ↗</button></div>
    <section class="filters panel" aria-labelledby="filter-heading">
      <div class="section-heading"><div><p class="eyebrow">絞り込み</p><h2 id="filter-heading">見たいデータを選ぶ</h2></div><button id="reset-filters" data-testid="reset-filters" class="text-button" type="button">条件をクリア</button></div>
      <div class="filter-grid">
        <label class="field"><span>開始日</span><input id="filter-from" data-testid="filter-from" type="date"></label>
        <label class="field"><span>終了日</span><input id="filter-to" data-testid="filter-to" type="date"></label>
        <label class="field"><span>カテゴリ</span><select id="filter-category" data-testid="filter-category"><option value="">全件</option></select></label>
        <label class="field search-field"><span>商品名</span><span class="search-wrap"><span aria-hidden="true">⌕</span><input id="filter-query" data-testid="filter-query" type="search" placeholder="商品名で検索"></span></label>
      </div>
    </section>
    <div id="errors" data-testid="errors" class="errors" role="status" aria-live="polite" hidden></div>
    <section class="metrics" aria-label="集計">
      <article class="metric-card"><div class="metric-label"><span>表示明細</span><span class="metric-mark">01</span></div><div class="metric-value"><strong id="metric-count" data-testid="metric-count">0</strong><span>件</span></div><p>絞り込み後の件数</p></article>
      <article class="metric-card"><div class="metric-label"><span>数量合計</span><span class="metric-mark">02</span></div><div class="metric-value"><strong id="metric-quantity" data-testid="metric-quantity">0</strong><span>点</span></div><p>対象商品の合計数量</p></article>
      <article class="metric-card revenue-card"><div class="metric-label"><span>売上合計</span><span class="metric-mark">03</span></div><div class="metric-value"><strong id="metric-revenue" data-testid="metric-revenue">¥0</strong></div><p>数量 × 単価の合計</p></article>
    </section>
    <section class="panel chart-panel"><div class="section-heading"><div><p class="eyebrow">内訳</p><h2>カテゴリ別売上</h2></div><span class="unit-note">売上金額</span></div><div id="category-chart" data-testid="category-chart" class="chart" role="img" aria-label="カテゴリ別売上"></div></section>
    <section class="panel table-panel"><div class="section-heading table-heading"><div><p class="eyebrow">売上明細</p><h2>明細一覧 <span id="table-count" class="count-pill">0</span></h2></div><div class="table-actions"><button id="sort-amount" data-testid="sort-amount" type="button" class="sort-button">金額: <span id="sort-label">降順</span> <span aria-hidden="true">↕</span></button><button id="export-csv" data-testid="export-csv" type="button" class="export-button"><span aria-hidden="true">↓</span> CSVを書き出す</button></div></div>
      <div class="table-scroll"><table id="sales-table" data-testid="sales-table"><thead><tr><th scope="col">日付</th><th scope="col">カテゴリ</th><th scope="col">商品名</th><th scope="col" class="numeric">数量</th><th scope="col" class="numeric">単価</th><th scope="col" class="numeric">売上金額</th></tr></thead><tbody id="sales-body"></tbody></table></div>
      <div id="empty-state" data-testid="empty-state" class="empty-state" hidden><span class="empty-icon">⌕</span><strong>該当する明細がありません</strong><span>条件を変更すると、ここに明細が表示されます。</span></div>
    </section>
    <footer>Sales Lens <span>•</span> データは端末内で処理されます</footer>
  </main>
</body>
</html>
