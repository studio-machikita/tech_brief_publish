<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050812" />
    <meta name="description" content="Explore the Sun, Earth, and Moon in an interactive 3D orbital laboratory." />
    <title>Orbit Lab — Solar System Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css">
<script type="importmap">{"imports": {"three": "../../../vendor/three/build/three.module.js", "three/addons/": "../../../vendor/three/examples/jsm/"}}</script>
</head>
  <body>
    <div id="app">
      <main class="viewport" aria-label="太陽・地球・月の3Dシミュレーション">
        <div id="scene" class="scene"></div>
        <div class="grid-overlay" aria-hidden="true"></div>
        <header class="topbar">
          <a class="brand" href="#" aria-label="Orbit Lab ホーム"><span class="brand-mark"><i></i><i></i><i></i></span><span>ORBIT<span class="brand-light"> LAB</span></span></a>
          <div class="top-meta"><span class="live-dot"></span><span>LIVE SIMULATION</span><span class="meta-divider"></span><span class="mono">SOL SYSTEM / 01</span></div>
          <button class="icon-button reset-top" id="resetTop" title="初期状態に戻す" aria-label="初期状態に戻す"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8m0-5v5h5"/></svg></button>
        </header>
        <div class="scene-hud hud-left"><span class="eyebrow">CELESTIAL MECHANICS</span><h1>動きを、<span>理解する。</span></h1><p>太陽・地球・月の軌道を、自由な視点で探索しよう。</p></div>
        <div class="scene-hud hud-right"><span class="hud-label">シミュレーション時刻</span><strong id="simTime">DAY <span>001</span></strong><div class="hud-rule"></div><span class="hud-label">地球の自転</span><strong id="rotationReadout">0.0<span>°</span></strong></div>
        <div class="scene-hint"><span class="mouse-icon"><i></i></span><span>ドラッグで回転 <b>·</b> スクロールでズーム</span></div>
        <aside class="info-card" id="infoCard" aria-live="polite">
          <div class="card-top"><span class="eyebrow" id="bodyIndex">01 / CELESTIAL BODY</span><button class="card-close" id="closeCard" aria-label="説明パネルを閉じる">×</button></div>
          <div class="body-heading"><span class="body-swatch" id="bodySwatch"></span><div><span class="body-kicker" id="bodyKicker">STAR · G2V</span><h2 id="bodyName">太陽</h2></div></div>
          <p class="body-description" id="bodyDescription"></p>
          <div class="card-stats"><div><span>直径</span><strong id="bodyDiameter"></strong></div><div><span>自転周期</span><strong id="bodyPeriod"></strong></div></div>
          <button class="focus-link" id="focusSelected">この天体にフォーカス <span>↗</span></button>
        </aside>
        <section class="controls" aria-label="シミュレーション操作">
          <div class="transport"><button class="play-button" id="playButton" aria-label="一時停止"><span class="pause-icon"><i></i><i></i></span><span class="play-label">一時停止</span></button><div class="control-separator"></div><div class="speed-control"><div class="control-label"><label for="speedSlider">時間速度</label><span class="speed-value" id="speedValue">1.0<span>×</span></span></div><input id="speedSlider" type="range" min="0.2" max="3" step="0.1" value="1" aria-label="シミュレーション速度"></div><button class="orbit-toggle active" id="orbitToggle" aria-pressed="true"><span class="orbit-icon">◎</span><span>軌道線</span><span class="toggle-indicator"></span></button></div>
          <div class="focus-row"><span class="focus-label">FOCUS</span><button class="focus-button" data-focus="sun"><span class="focus-dot sun-dot"></span>太陽</button><button class="focus-button active" data-focus="earth"><span class="focus-dot earth-dot"></span>地球</button><button class="focus-button" data-focus="moon"><span class="focus-dot moon-dot"></span>月</button><span class="focus-spacer"></span><button class="reset-button" id="resetButton"><span>↺</span> 初期状態</button></div>
        </section>
        <div id="webglMessage" class="webgl-message" hidden><span>◌</span><h2>3D表示を利用できません</h2><p>このブラウザではWebGLが無効か、対応していません。WebGLを有効にしたブラウザで開いてください。</p></div>
      </main>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
