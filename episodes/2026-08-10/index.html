<!DOCTYPE html>

<style>:root {
  --bg: #121212;
  --surface: #1E1E1E;
  --surface-strong: #252525;
  --border: rgba(255, 255, 255, 0.05);
  --text: #E0E0E0;
  --text-muted: #A0A0A0;
  --accent: #00D8FF;
  --accent-light: #6C8AFF;
  --accent-soft: rgba(0, 216, 255, 0.1);
  --success: #10b981;
  --warning: #f59e0b;
  --strong: #fff;
  --border-radius: 12px;
}
[data-theme="light"] {
  --bg: #f5f5f5;
  --surface: #ffffff;
  --surface-strong: #f0f0f0;
  --border: rgba(0, 0, 0, 0.08);
  --text: #1a1a1a;
  --text-muted: #666666;
  --accent: #0099b3;

}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
  background: var(--bg);
  color: var(--text);

}
a { color: var(--accent-light); text-decoration: none; }

button, input, textarea, select { font: inherit; }
.container { max-width: 800px; margin: 0 auto; padding: 40px 20px 80px; }

/* Header */
header {
  border-bottom: 1px solid var(--border);
  padding: 0;
  margin-bottom: 0;
}
header .container { padding: 24px 20px; }
header h1 { font-size: 1.5rem; font-weight: 700; }
header h1 a { color: var(--strong); }

header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem; }
.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
}
.nav-links {

  gap: 8px;
  margin-top: 12px;
  overflow-x: auto;
  white-space: nowrap;
}
.nav-links::-webkit-scrollbar { display: none; }
.nav-links a {
  color: var(--text-muted);
  font-size: 0.95rem;
  font-weight: bold;
  padding: 8px 16px;
  transition: color 0.2s ease;
}
.nav-links a:hover { color: var(--strong); text-decoration: none; }
.theme-toggle {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);

  font-size: 1.1rem;
  padding: 0.35rem 0.6rem;
  line-height: 1;
  transition: background 0.3s, border-color 0.3s;
}
.theme-toggle:hover { border-color: var(--accent); }

/* Section titles */
.section-title {

  font-weight: bold;
  margin-bottom: 8px;
  color: var(--strong);
  letter-spacing: 0.05em;
}
.section-subtitle {

}

}

/* Grid layout */
.grid {

}
.col-half { width: calc(50% - 12px); }
.col-full { width: 100%; }

/* Cards */
.card {

.card h2 {

}
.card li:last-child { margin-bottom: 0; }
.list-check li::before { content: '\2713'; position: absolute; left: 0; color: var(--accent); font-weight: bold; font-size: 1.1em; }
.list-arrow li::before { content: '\2794'; position: absolute; left: 0; color: var(--text-muted); font-size: 0.9em; top: 0.1em; }

</style>
<script>
(function(){
  var t = localStorage.getItem('theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
})();
function toggleTheme(){
  var el = document.documentElement;
  if (el.getAttribute('data-theme') === 'light') {
    el.removeAttribute('data-theme');
    localStorage.setItem('theme', 'dark');
  } else {
    el.setAttribute('data-theme', 'light');
    localStorage.setItem('theme', 'light');
  }
  updateIcon();
}
function updateIcon(){
  var btn = document.getElementById('theme-btn');
  if (!btn) return;

## 🤖 Google DeepMindの「WeatherNext」、サイクロンの進路と強度を同時に予測
\`AI\` \`Science\`

<details>
<summary>📄 原題: Google Deepmind&#x27;s WeatherNext predicts cyclone tracks and intensity at the same time</summary>
</details>

> **一言で**: Google DeepmindのAIが台風進路と強度を同時予測

- WeatherNextは台風の進路と強度を同時に予測する新モデル
- 既存の運用予測モデルより約1日長く先読みできる
- 従来の気象予測が10年かけて進んだ精度向上に匹敵
- コードとモデルの重みはGitHubで公開済み

💡 **なぜ重要か**
台風の進路予測は防災に直結しますが、強度予測は精度が低く別モデルで扱われてきました。両者を同時に予測できれば、避難計画や被害想定の精度が上がると期待されています。 気象予測AIの精度向上は、防災機関や保険業界、航空・海運など幅広い産業の意思決定を支えます。オープンソース化により研究機関や新興企業が独自に改良や検証を進めやすくなりそうです。

🎯 **今日のアクション**
気象データを扱うエンジニアは公開されたモデルの重みとコードを確認し、自社の予測パイプラインへの組み込みを検討するとよいでしょう。防災関連サービス開発者は精度向上の恩恵を早期に評価すべきです。

## 🤖 Amazon Bedrock AgentCoreの新機能:単一アクションを超えたエージェントの動作とコストを制御
\`AI\` \`Cloud\`

<details>
<summary>📄 原題: Control agent behaviors and cost beyond a single action: new capabilities in Amazon Bedrock AgentCore</summary>
</details>

> **一言で**: Bedrock AgentCoreがエージェントの行動とコストを制御

- Dogwoodという新しいオープンソースのポリシー言語を導入
- エージェントの一連の行動を決定論的に制御できる時間的ポリシー機能
- ゲートウェイでのレート制限で、コストの上限を確実に設定できる
- 単一のアクションだけでなく、行動の連鎖全体を管理できる点が特徴

💡 **なぜ重要か**
AIエージェントは自律的に複数の行動を連続で実行するため、想定外の動作やコスト超過が起きやすいという課題がありました。単一アクションの制御だけでは不十分で、行動の連鎖全体を管理する仕組みが求められていたと見られています。 AIエージェントを本番環境で運用する企業が増えるなか、動作の予測可能性とコスト管理の両立が業界全体の課題になっています。こうした制御機能の標準化が進めば、エージェント技術の企業導入が加速すると考えられます。

🎯 **今日のアクション**
Bedrock AgentCoreを使う開発者は、Dogwoodによるポリシー設計とゲートウェイのレート制限設定を早めに検証し、コスト超過のリスクを事前に把握しておくべきです。

🔗 [原文を読む](https://aws.amazon.com/blogs/machine-learning/control-agent-behaviors-and-cost-beyond-a-single-action-new-capabilities-in-amazon-bedrock-agentcore/)
